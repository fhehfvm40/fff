<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Z플립 타이머</title>
  <style>
    body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; touch-action: none; }
    .container { flex: 1; display: flex; flex-direction: column; padding: 12px; box-sizing: border-box; justify-content: space-between; }
    
    .header { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #ffb300; }
    .small-btn { padding: 6px 12px; font-size: 12px; background: #333; border: none; color: white; border-radius: 6px; }
    
    .time-display { font-size: 16vw; white-space: nowrap; text-align: center; font-weight: bold; font-variant-numeric: tabular-nums; margin: auto 0; color: #0ff; text-shadow: 0 0 10px rgba(0,255,255,0.4); line-height: 1; }
    
    .controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
    button { background: #333; border: none; color: white; padding: 14px 0; border-radius: 10px; font-size: 16px; font-weight: bold; touch-action: manipulation; }
    button:active { background: #555; }
    
    .main-btn { display: flex; gap: 8px; }
    .main-btn button { flex: 1; padding: 18px 0; font-size: 18px; }
    .main-btn .start { background: #0a84ff; }
    .main-btn .reset { background: #ff453a; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 100; flex-direction: column; align-items: center; justify-content: center; }
    .modal input { font-size: 40px; width: 60%; text-align: center; padding: 15px; border-radius: 10px; border: 2px solid #0a84ff; background: #222; color: #fff; margin-bottom: 20px; outline: none; }
    .modal p { color: #aaa; margin-bottom: 5px; font-size: 14px; }
    .modal-btns { display: flex; gap: 10px; width: 80%; }
    .modal-btns button { flex: 1; padding: 15px 0; font-size: 16px; }
    .modal-btns .apply { background: #0a84ff; }
    .modal-btns .cancel { background: #555; }
  </style>
</head>
<body>
  <div class="container">
    
    <div class="header">
      <button class="small-btn" onclick="saveRecord()">저장</button>
      <span id="totalTimeStr" style="font-weight: bold;">총 누적: 00:00:00</span>
      <div>
        <!-- 전체화면 버튼 추가됨 -->
        <button class="small-btn" style="margin-right: 4px;" onclick="toggleFullScreen()">⛶</button>
        <button class="small-btn" onclick="viewRecords()">기록</button>
      </div>
    </div>
    
    <div style="text-align: center; margin-top: 10px;">
      <label style="font-size: 13px; color: #aaa;">
        <input type="checkbox" id="autoRepeat" checked> 0초 도달 시 자동 반복 🔄
      </label>
    </div>

    <!-- 클릭 시 시간 수정 모달창 열림 -->
    <div id="timeDisplay" class="time-display" onclick="openEditModal()">00:00</div>

    <div class="controls">
      <button onclick="addMins(10)">+10분</button>
      <button onclick="addMins(20)">+20분</button>
      <button onclick="addMins(30)">+30분</button>
    </div>

    <div class="main-btn">
      <button class="reset" onclick="resetTimer()">리셋</button>
      <button class="start" id="startBtn" onclick="toggleTimer()">시작</button>
    </div>
    
  </div>

  <div id="editModal" class="modal">
    <p>설정할 시간(분)을 입력하세요</p>
    <input type="number" id="customMin" inputmode="numeric" pattern="[0-9]*" placeholder="0">
    <div class="modal-btns">
      <button class="cancel" onclick="closeEditModal()">취소</button>
      <button class="apply" onclick="applyCustomTime()">적용</button>
    </div>
  </div>

  <script>
    let time = 0, initial = 0, total = 0, timerId = null, resetCount = 0;
    const display = document.getElementById('timeDisplay');
    const startBtn = document.getElementById('startBtn');
    const totalStr = document.getElementById('totalTimeStr');
    const autoRep = document.getElementById('autoRepeat');
    const editModal = document.getElementById('editModal');
    const customMinInput = document.getElementById('customMin');
    
    let audioCtx;
    function initAudio() { if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

    function beep() {
      if(navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 500, 200, 500, 200, 500]);
      if(audioCtx) {
        for(let i=0; i<5; i++) {
          let osc = audioCtx.createOscillator();
          osc.connect(audioCtx.destination);
          osc.frequency.value = 800;
          osc.start(audioCtx.currentTime + i);
          osc.stop(audioCtx.currentTime + i + 0.5);
        }
      }
    }

    function fmt(s) {
      let h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sc = s%60;
      if(h>0) return `${h}:${m.toString().padStart(2,'0')}:${sc.toString().padStart(2,'0')}`;
      return `${m.toString().padStart(2,'0')}:${sc.toString().padStart(2,'0')}`;
    }
    
    function updateUI() {
      display.innerText = fmt(time);
      totalStr.innerText = "총 누적: " + fmt(total);
    }

    function addMins(m) {
      initAudio();
      let secs = m * 60;
      time += secs;
      initial += secs;
      updateUI();
      if(!timerId) toggleTimer();
      resetCount = 0;
    }

    function toggleTimer() {
      initAudio();
      if(timerId) {
        clearInterval(timerId); timerId = null;
        startBtn.innerText = "시작";
        startBtn.style.background = "#0a84ff";
      } else if(time > 0) {
        startBtn.innerText = "정지";
        startBtn.style.background = "#ff9f0a";
        timerId = setInterval(() => {
          time--;
          if(time <= 0) {
            total += initial;
            beep();
            if(autoRep.checked && initial > 0) { time = initial; } 
            else { clearInterval(timerId); timerId = null; time = 0; startBtn.innerText = "시작"; startBtn.style.background = "#0a84ff"; }
          }
          updateUI();
        }, 1000);
      }
      resetCount = 0;
    }

    function resetTimer() {
      if(timerId) toggleTimer();
      resetCount++;
      if(resetCount >= 2) { time = 0; initial = 0; total = 0; resetCount = 0; } 
      else { time = initial; }
      updateUI();
    }

    function openEditModal() {
      if(timerId) toggleTimer();
      customMinInput.value = Math.floor(time / 60);
      editModal.style.display = 'flex';
      customMinInput.focus();
    }

    function closeEditModal() {
      editModal.style.display = 'none';
    }

    function applyCustomTime() {
      let m = parseInt(customMinInput.value);
      if(isNaN(m) || m < 0) m = 0;
      let secs = m * 60;
      time = secs;
      initial = secs;
      updateUI();
      closeEditModal();
      resetCount = 0;
    }

    function saveRecord() {
      let memo = prompt("달성한 시간을 저장합니다. 내용을 적어주세요:");
      if(memo !== null) {
        let recs = JSON.parse(localStorage.getItem('flipTimer') || '[]');
        recs.push({date: new Date().toLocaleString('ko-KR').slice(0,-3), time: fmt(total), memo: memo});
        localStorage.setItem('flipTimer', JSON.stringify(recs));
        alert("저장되었습니다.");
      }
    }

    function viewRecords() {
      let recs = JSON.parse(localStorage.getItem('flipTimer') || '[]');
      if(recs.length === 0) { alert("저장된 기록이 없습니다."); return; }
      let str = "==== 누적 기록 ====\n\n";
      recs.forEach(r => str += `${r.date} [${r.time}]\n- ${r.memo}\n\n`);
      if(confirm(str + "기록을 전부 지우시겠습니까? (취소 시 유지)")) {
        localStorage.removeItem('flipTimer');
        alert("삭제되었습니다.");
      }
    }

    /* 전체화면 기능 추가됨 */
    function toggleFullScreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(err => {
          console.log(err);
        });
      } else {
        document.exitFullscreen();
      }
    }

    updateUI();
  </script>
</body>
</html>
