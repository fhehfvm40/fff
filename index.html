<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>연간 PLAN - 해마다 쓰는 나만의 계획표</title>

  <!-- Tailwind CSS CDN (별도 설치 없이 GitHub Pages에서 즉시 스타일 적용) -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts: Noto Sans KR -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <style>
    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* 인쇄(A4) 전용 스타일 */
    @media print {
      @page {
        size: A4 portrait;
        margin: 12mm;
      }
      body {
        background: #ffffff !important;
      }
      #main-app,
      #toast-container,
      #confirm-modal,
      .no-print {
        display: none !important;
      }
      #preview-modal {
        position: static !important;
        inset: auto !important;
        background: #ffffff !important;
        padding: 0 !important;
        display: block !important;
        overflow: visible !important;
      }
      #preview-sheet {
        max-width: 100% !important;
        max-height: none !important;
        overflow: visible !important;
        box-shadow: none !important;
        border-radius: 0 !important;
      }
      #preview-content {
        padding: 0 !important;
      }
      .break-inside-avoid {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen antialiased">

  <!-- 메인 앱 영역 -->
  <div id="main-app" class="min-h-screen pb-24">
    <!-- 상단 헤더 & 연도 선택 -->
    <header class="bg-white/95 backdrop-blur border-b border-slate-200 sticky top-0 z-20">
      <div class="max-w-lg mx-auto px-4 py-3 flex items-center justify-between gap-2">
        <div class="flex items-center">
          <button
            id="btn-prev-year"
            type="button"
            class="p-2 text-slate-500 hover:text-teal-700 hover:bg-slate-100 rounded-full transition-colors"
            aria-label="이전 연도"
          >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>

          <div class="flex items-center gap-2 px-2 sm:px-3">
            <svg class="text-teal-600 shrink-0" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M8 2v4" /><path d="M16 2v4" />
              <rect width="18" height="18" x="3" y="4" rx="2" />
              <path d="M3 10h18" />
              <path d="M12 18.5c-2.2-1.4-3.5-2.8-3.5-4.3 0-1.2.9-2.2 2.1-2.2.7 0 1.2.4 1.4.9.2-.5.7-.9 1.4-.9 1.2 0 2.1 1 2.1 2.2 0 1.5-1.3 2.9-3.5 4.3Z" />
            </svg>
            <h1 id="header-year-title" class="text-lg sm:text-xl font-bold text-slate-800 whitespace-nowrap">
              2026년 PLAN
            </h1>
          </div>

          <button
            id="btn-next-year"
            type="button"
            class="p-2 text-slate-500 hover:text-teal-700 hover:bg-slate-100 rounded-full transition-colors"
            aria-label="다음 연도"
          >
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m9 18 6-6-6-6" />
            </svg>
          </button>
        </div>

        <button
          id="btn-open-preview"
          type="button"
          class="flex items-center gap-1.5 bg-teal-50 text-teal-700 border border-teal-200 hover:bg-teal-100 px-3 py-2 rounded-lg text-sm font-semibold transition-colors shrink-0"
        >
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
            <path d="M14 2v4a2 2 0 0 0 2 2h4" />
            <path d="M10 9H8" /><path d="M16 13H8" /><path d="M16 17H8" />
          </svg>
          <span><span class="hidden sm:inline">양식 </span>미리보기</span>
        </button>
      </div>
    </header>

    <!-- 본문 컨테이너 -->
    <main class="max-w-lg mx-auto px-4 pt-4 space-y-6">
      <!-- 상단 유틸리티 바 (작년 불러오기 & 백업/복원) -->
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex items-center gap-1.5">
          <button
            id="btn-export-json"
            type="button"
            class="flex items-center gap-1 text-xs font-medium text-slate-600 bg-white hover:bg-slate-50 border border-slate-200 px-2.5 py-2 rounded-lg transition-colors shadow-sm"
            title="현재 계획을 백업 파일(.json)로 저장합니다"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" x2="12" y1="15" y2="3" />
            </svg>
            <span>파일 백업</span>
          </button>

          <button
            id="btn-import-json"
            type="button"
            class="flex items-center gap-1 text-xs font-medium text-slate-600 bg-white hover:bg-slate-50 border border-slate-200 px-2.5 py-2 rounded-lg transition-colors shadow-sm"
            title="저장해 둔 백업 파일(.json)을 불러옵니다"
          >
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="17 8 12 3 7 8" />
              <line x1="12" x2="12" y1="3" y2="15" />
            </svg>
            <span>불러오기</span>
          </button>
          <input id="input-import-file" type="file" accept=".json,application/json" class="hidden" />
        </div>

        <button
          id="btn-copy-prev-year"
          type="button"
          class="flex items-center gap-1.5 text-xs sm:text-sm font-medium text-slate-600 hover:text-teal-700 hover:bg-teal-50 px-3 py-2 rounded-lg transition-colors border border-transparent hover:border-teal-200"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
          </svg>
          <span id="copy-prev-label">작년(2025년) 계획 불러오기</span>
        </button>
      </div>

      <!-- 로딩 스피너 -->
      <div id="loading-view" class="py-20 flex flex-col items-center justify-center gap-3">
        <div class="animate-spin rounded-full h-10 w-10 border-2 border-slate-200 border-t-teal-600"></div>
        <p class="text-sm text-slate-500">계획을 불러오는 중입니다...</p>
      </div>

      <!-- 실제 계획 컨텐츠 영역 -->
      <div id="plan-content" class="space-y-6 hidden">
        <!-- 올해의 푯대 말씀 -->
        <section id="motto-section"></section>

        <!-- 핵심 계획 (1.신앙적, 2.신체적, 3.WORK, 4.자기개발) -->
        <section id="categories-section" class="space-y-4"></section>

        <!-- 나의 역할 (체크리스트) -->
        <section class="pt-5 border-t border-slate-200">
          <div class="mb-4 pl-3 border-l-4 border-teal-500">
            <h2 class="text-lg font-bold text-slate-800">나의 역할 (체크리스트)</h2>
            <p class="text-xs text-slate-500 mt-1">어떤 상황이 벌어진다 하더라도 순종하는 마음으로</p>
          </div>
          <div id="roles-section" class="space-y-4"></div>
        </section>
      </div>
    </main>
  </div>

  <!-- A4 양식 미리보기 모달 -->
  <div
    id="preview-modal"
    class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-2 sm:p-6"
    role="dialog"
    aria-modal="true"
  >
    <div id="preview-sheet" class="bg-white w-full max-w-4xl max-h-full overflow-y-auto rounded-xl shadow-2xl flex flex-col">
      <!-- 모달 헤더 (인쇄 시 숨김) -->
      <div class="no-print sticky top-0 z-10 bg-slate-100/95 backdrop-blur border-b border-slate-200 p-4 flex justify-between items-center">
        <h2 class="text-base sm:text-lg font-bold flex items-center gap-2 text-slate-800">
          <svg class="text-teal-600" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z" />
            <path d="M14 2v4a2 2 0 0 0 2 2h4" />
          </svg>
          작성 양식 미리보기
        </h2>
        <div class="flex gap-2">
          <button
            id="btn-print"
            type="button"
            class="flex items-center gap-1.5 px-3.5 py-2 bg-teal-600 hover:bg-teal-700 text-white rounded-lg text-sm font-medium transition-colors"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2" />
              <path d="M6 9V3a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v6" />
              <rect x="6" y="14" width="12" height="8" rx="1" />
            </svg>
            인쇄하기
          </button>
          <button
            id="btn-close-preview"
            type="button"
            class="p-2 bg-slate-200 hover:bg-slate-300 rounded-lg text-slate-700 transition-colors"
            aria-label="닫기"
          >
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 6 6 18" /><path d="m6 6 12 12" />
            </svg>
          </button>
        </div>
      </div>

      <!-- A4 문서 본문 -->
      <div id="preview-content" class="p-6 sm:p-10 text-black bg-white"></div>
    </div>
  </div>

  <!-- 커스텀 확인 모달 (브라우저 기본 confirm/alert 대체) -->
  <div
    id="confirm-modal"
    class="fixed inset-0 z-50 bg-black/50 backdrop-blur-xs hidden items-center justify-center p-4"
    role="dialog"
    aria-modal="true"
  >
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl border border-slate-100 p-5 space-y-4">
      <h3 id="confirm-title" class="text-base font-bold text-slate-800">확인</h3>
      <p id="confirm-message" class="text-sm text-slate-600 whitespace-pre-line leading-relaxed"></p>
      <div class="flex justify-end gap-2 pt-1">
        <button
          id="confirm-cancel-btn"
          type="button"
          class="px-4 py-2 text-sm font-medium text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors"
        >
          취소
        </button>
        <button
          id="confirm-ok-btn"
          type="button"
          class="px-4 py-2 text-sm font-medium text-white bg-teal-600 hover:bg-teal-700 rounded-lg transition-colors"
        >
          확인
        </button>
      </div>
    </div>
  </div>

  <!-- 하단 상태 토스트 알림 -->
  <div
    id="toast-container"
    class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 pointer-events-none transition-all duration-300 opacity-0 translate-y-2"
  >
    <div id="toast-box" class="bg-slate-800/95 backdrop-blur text-white text-sm px-4 py-2.5 rounded-full shadow-lg flex items-center gap-2 whitespace-nowrap"></div>
  </div>

  <!-- 앱 스크립트 (ES Module) -->
  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
    import {
      getAuth,
      signInAnonymously,
      signInWithCustomToken,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
    import {
      getFirestore,
      doc,
      setDoc,
      getDoc,
      onSnapshot
    } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';

    // =========================================================================
    // [선택 사항] GitHub Pages 배포 후 여러 기기에서 자동 저장을 원하시면
    // 본인의 Firebase 웹 앱 설정값을 아래에 채워 넣으세요.
    // 비워 두어도 앱은 정상 작동하며, 상단의 '파일 백업 / 불러오기'로 저장할 수 있습니다.
    // =========================================================================
    const GITHUB_FIREBASE_CONFIG = {
      apiKey: '',
      authDomain: '',
      projectId: '',
      storageBucket: '',
      messagingSenderId: '',
      appId: ''
    };

    // 실행 환경에 따라 설정 자동 선택
    let envFirebaseConfig = null;
    try {
      if (typeof __firebase_config !== 'undefined' && __firebase_config) {
        envFirebaseConfig = JSON.parse(__firebase_config);
      }
    } catch (err) {
      console.error('환경 설정 파싱 오류:', err);
    }

    const activeFirebaseConfig =
      envFirebaseConfig && envFirebaseConfig.apiKey
        ? envFirebaseConfig
        : GITHUB_FIREBASE_CONFIG.apiKey
          ? GITHUB_FIREBASE_CONFIG
          : null;

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'annual-plan-app';

    let auth = null;
    let db = null;
    if (activeFirebaseConfig) {
      try {
        const fbApp = initializeApp(activeFirebaseConfig);
        auth = getAuth(fbApp);
        db = getFirestore(fbApp);
      } catch (err) {
        console.error('클라우드 초기화 오류:', err);
      }
    }

    // =========================================================================
    // 기본 양식 & 정렬 순서 상수
    // =========================================================================
    const CATEGORY_ORDER = ['faith', 'daily', 'work', 'self_dev'];
    const ROLE_ORDER = [
      'pastor',
      'faith_life',
      'leader',
      'choir',
      'teacher',
      'wife',
      'mother',
      'homemaker',
      'my_work',
      'others'
    ];

    const DEFAULT_PLAN = {
      motto:
        '올해에는 오직 주님만!\n나의 신앙 가치관이 굳게 서도록, 일상에서 마음에 담아두고 기억해 실천할 수 있도록',
      categories: {
        faith: { title: '1. 신앙적', items: [] },
        daily: { title: '2. 신체적', items: [] },
        work: { title: '3. WORK', items: [] },
        self_dev: { title: '4. 자기개발', items: [] }
      },
      roles: {
        pastor: { title: '하나님', items: [] },
        faith_life: { title: '신앙 생활', items: [] },
        leader: { title: '구역장(리더)', items: [] },
        choir: { title: '봉사', items: [] },
        teacher: { title: '교사(스텝)', items: [] },
        wife: { title: '아내', items: [] },
        mother: { title: '엄마', items: [] },
        homemaker: { title: '아빠', items: [] },
        my_work: { title: 'My work', items: [] },
        others: { title: '기타', items: [] }
      }
    };

    // =========================================================================
    // 앱 상태 관리
    // =========================================================================
    const state = {
      user: null,
      year: new Date().getFullYear(),
      plansByYear: {}, // 세션 메모리 캐시 (연도별)
      planData: null,
      unsubscribeSnapshot: null,
      editingMotto: false,
      editingTitle: null, // { sectionType, key }
      editingItem: null, // { sectionType, key, id }
      addingSection: null, // { sectionType, key }
      toastTimer: null,
      confirmCallback: null
    };

    // =========================================================================
    // 유틸리티 함수
    // =========================================================================
    const deepClone = (obj) => JSON.parse(JSON.stringify(obj));

    const generateId = () => Math.random().toString(36).substring(2, 11);

    const escapeHtml = (str) =>
      String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');

    const getOrderedEntries = (obj, orderList) => {
      if (!obj) return [];
      const result = [];
      orderList.forEach((key) => {
        if (obj[key]) result.push([key, obj[key]]);
      });
      Object.entries(obj).forEach(([key, val]) => {
        if (!orderList.includes(key)) result.push([key, val]);
      });
      return result;
    };

    // 기존 3개 카테고리 문서를 4개 구조(1.신앙적, 2.신체적, 3.WORK, 4.자기개발)로 자동 보정
    const normalizePlanData = (rawData) => {
      const data = deepClone(rawData || DEFAULT_PLAN);
      const cats = data.categories || {};
      let migrated = false;

      if (cats.relations || !cats.work || !cats.self_dev) {
        data.categories = {
          faith: {
            title: cats.faith?.title === '1. 신앙 생활' ? '1. 신앙적' : (cats.faith?.title || '1. 신앙적'),
            items: Array.isArray(cats.faith?.items) ? cats.faith.items : []
          },
          daily: {
            title: cats.daily?.title === '2. 일상 / 기타' ? '2. 신체적' : (cats.daily?.title || '2. 신체적'),
            items: Array.isArray(cats.daily?.items) ? cats.daily.items : []
          },
          work: cats.work || {
            title: '3. WORK',
            items: Array.isArray(cats.relations?.items) ? cats.relations.items : []
          },
          self_dev: cats.self_dev || {
            title: '4. 자기개발',
            items: []
          }
        };
        migrated = true;
      }

      if (!data.roles) {
        data.roles = deepClone(DEFAULT_PLAN.roles);
        migrated = true;
      }
      if (typeof data.motto !== 'string') {
        data.motto = DEFAULT_PLAN.motto;
        migrated = true;
      }

      return { data, migrated };
    };

    // =========================================================================
    // UI 알림 (토스트 & 커스텀 확인 모달)
    // =========================================================================
    const showToast = (message, type = 'info') => {
      const container = document.getElementById('toast-container');
      const box = document.getElementById('toast-box');
      if (!container || !box) return;

      const iconSvg =
        type === 'success'
          ? '<svg class="text-teal-400 shrink-0" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12" /></svg>'
          : type === 'error'
            ? '<svg class="text-rose-400 shrink-0" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>'
            : '';

      box.innerHTML = `${iconSvg}<span>${escapeHtml(message)}</span>`;
      container.classList.remove('opacity-0', 'translate-y-2');
      container.classList.add('opacity-100', 'translate-y-0');

      clearTimeout(state.toastTimer);
      state.toastTimer = setTimeout(() => {
        container.classList.add('opacity-0', 'translate-y-2');
        container.classList.remove('opacity-100', 'translate-y-0');
      }, 2400);
    };

    const openConfirmModal = ({ title, message, confirmText = '확인', isDanger = false, onConfirm }) => {
      const modal = document.getElementById('confirm-modal');
      const titleEl = document.getElementById('confirm-title');
      const msgEl = document.getElementById('confirm-message');
      const okBtn = document.getElementById('confirm-ok-btn');

      titleEl.textContent = title;
      msgEl.textContent = message;
      okBtn.textContent = confirmText;
      okBtn.className = isDanger
        ? 'px-4 py-2 text-sm font-medium text-white bg-rose-600 hover:bg-rose-700 rounded-lg transition-colors'
        : 'px-4 py-2 text-sm font-medium text-white bg-teal-600 hover:bg-teal-700 rounded-lg transition-colors';

      state.confirmCallback = onConfirm;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    };

    const closeConfirmModal = () => {
      const modal = document.getElementById('confirm-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
      state.confirmCallback = null;
    };

    // =========================================================================
    // 데이터 로드 & 저장 로직
    // =========================================================================
    const setLoading = (isLoading) => {
      const loadingEl = document.getElementById('loading-view');
      const contentEl = document.getElementById('plan-content');
      if (isLoading) {
        loadingEl.classList.remove('hidden');
        contentEl.classList.add('hidden');
      } else {
        loadingEl.classList.add('hidden');
        contentEl.classList.remove('hidden');
      }
    };

    const updateYearHeader = () => {
      document.getElementById('header-year-title').textContent = `${state.year}년 PLAN`;
      document.getElementById('copy-prev-label').textContent = `작년(${state.year - 1}년) 계획 불러오기`;
    };

    const loadYearPlan = () => {
      updateYearHeader();
      state.editingMotto = false;
      state.editingTitle = null;
      state.editingItem = null;
      state.addingSection = null;

      // 이전 연도 리스너 정리
      if (state.unsubscribeSnapshot) {
        state.unsubscribeSnapshot();
        state.unsubscribeSnapshot = null;
      }

      // 클라우드(Firestore) 연결 시
      if (db && state.user) {
        setLoading(true);
        const planRef = doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', String(state.year));
        state.unsubscribeSnapshot = onSnapshot(
          planRef,
          (docSnap) => {
            if (docSnap.exists()) {
              const { data, migrated } = normalizePlanData(docSnap.data());
              state.planData = data;
              state.plansByYear[state.year] = deepClone(data);
              if (migrated) {
                setDoc(planRef, data).catch((err) => console.error('마이그레이션 저장 오류:', err));
              }
            } else {
              const initial = deepClone(DEFAULT_PLAN);
              state.planData = initial;
              state.plansByYear[state.year] = deepClone(initial);
              setDoc(planRef, initial).catch((err) => console.error('기본 양식 생성 오류:', err));
            }
            setLoading(false);
            renderAll();
          },
          (error) => {
            console.error('데이터 조회 오류:', error);
            if (!state.plansByYear[state.year]) {
              state.plansByYear[state.year] = deepClone(DEFAULT_PLAN);
            }
            state.planData = deepClone(state.plansByYear[state.year]);
            setLoading(false);
            renderAll();
            showToast('데이터를 불러오는 중 문제가 발생했습니다.', 'error');
          }
        );
        return;
      }

      // 클라우드 미설정 시 (GitHub Pages 정적 배포 기본 모드: 메모리 + JSON 백업)
      if (!state.plansByYear[state.year]) {
        state.plansByYear[state.year] = deepClone(DEFAULT_PLAN);
      }
      state.planData = deepClone(state.plansByYear[state.year]);
      setLoading(false);
      renderAll();
    };

    const savePlanData = async (updatedData, successMsg = '자동 저장됨') => {
      state.planData = updatedData;
      state.plansByYear[state.year] = deepClone(updatedData);
      renderAll();

      if (db && state.user) {
        const planRef = doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', String(state.year));
        try {
          await setDoc(planRef, updatedData);
          showToast(successMsg, 'success');
        } catch (err) {
          console.error('저장 오류:', err);
          showToast('저장 중 오류가 발생했습니다.', 'error');
        }
      } else {
        showToast('적용됨 (영구 보관은 파일 백업 이용)', 'success');
      }
    };

    // =========================================================================
    // 작년 계획 불러오기 (체크박스 초기화)
    // =========================================================================
    const handleCopyPreviousYear = () => {
      const prevYear = state.year - 1;
      openConfirmModal({
        title: `${prevYear}년 계획 불러오기`,
        message: `${prevYear}년의 계획을 불러오시겠습니까?\n현재 작성된 ${state.year}년 내용은 덮어쓰기 되며, 체크박스는 모두 새롭게 초기화됩니다.`,
        confirmText: '불러오기',
        onConfirm: async () => {
          closeConfirmModal();
          let prevData = null;

          if (db && state.user) {
            try {
              const prevRef = doc(db, 'artifacts', appId, 'users', state.user.uid, 'plans', String(prevYear));
              const snap = await getDoc(prevRef);
              if (snap.exists()) {
                prevData = snap.data();
              }
            } catch (err) {
              console.error('작년 계획 조회 오류:', err);
              showToast('작년 데이터를 불러오는 중 오류가 발생했습니다.', 'error');
              return;
            }
          } else if (state.plansByYear[prevYear]) {
            prevData = state.plansByYear[prevYear];
          }

          if (!prevData) {
            showToast(`${prevYear}년에 저장된 계획이 없습니다.`, 'error');
            return;
          }

          const { data: resetData } = normalizePlanData(prevData);
          Object.values(resetData.categories || {}).forEach((cat) => {
            (cat.items || []).forEach((item) => {
              item.checked = false;
            });
          });
          Object.values(resetData.roles || {}).forEach((role) => {
            (role.items || []).forEach((item) => {
              item.checked = false;
            });
          });

          await savePlanData(resetData, `${prevYear}년 계획 불러오기 완료!`);
        }
      });
    };

    // =========================================================================
    // JSON 파일 백업 & 복원 (GitHub Pages 정적 환경 지원)
    // =========================================================================
    const handleExportJson = () => {
      if (!state.planData) return;
      const payload = {
        exportedAt: new Date().toISOString(),
        currentYear: state.year,
        plansByYear: {
          ...state.plansByYear,
          [state.year]: state.planData
        }
      };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `annual-plan-${state.year}.json`;
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      URL.revokeObjectURL(url);
      showToast('백업 파일이 저장되었습니다.', 'success');
    };

    const handleImportJson = (file) => {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          let importedPlan = null;

          if (parsed && parsed.plansByYear && typeof parsed.plansByYear === 'object') {
            // 모든 연도 캐시 병합
            Object.entries(parsed.plansByYear).forEach(([yr, pData]) => {
              const { data } = normalizePlanData(pData);
              state.plansByYear[Number(yr)] = data;
            });
            const targetYear = parsed.plansByYear[state.year]
              ? state.year
              : Number(parsed.currentYear) || Number(Object.keys(parsed.plansByYear)[0]);
            state.year = targetYear;
            updateYearHeader();
            importedPlan = state.plansByYear[targetYear];
          } else if (parsed && (parsed.categories || parsed.roles)) {
            const { data } = normalizePlanData(parsed);
            importedPlan = data;
          }

          if (!importedPlan) {
            showToast('올바른 계획 백업 파일이 아닙니다.', 'error');
            return;
          }

          await savePlanData(importedPlan, '백업 파일을 불러왔습니다!');
        } catch (err) {
          console.error('파일 파싱 오류:', err);
          showToast('파일을 읽는 중 오류가 발생했습니다.', 'error');
        }
      };
      reader.readAsText(file);
    };

    // =========================================================================
    // 렌더링 함수
    // =========================================================================
    const renderMotto = () => {
      const container = document.getElementById('motto-section');
      const motto = state.planData?.motto || '';

      if (state.editingMotto) {
        container.innerHTML = `
          <div class="w-full bg-teal-50/70 p-4 rounded-2xl border border-teal-200 shadow-sm">
            <div class="text-xs text-teal-700 font-bold mb-2 flex items-center gap-1.5">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
                <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
              </svg>
              올해의 푯대 말씀 입력
            </div>
            <textarea
              id="motto-textarea"
              rows="3"
              class="w-full p-3 text-sm border border-teal-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-teal-500 resize-none bg-white"
              placeholder="올해의 푯대 말씀이나 다짐을 적어보세요. (예: 올해에는 오직 주님만!)"
            >${escapeHtml(motto)}</textarea>
            <div class="flex justify-end gap-2 mt-3">
              <button
                type="button"
                data-action="cancel-motto"
                class="px-3.5 py-2 text-sm font-medium text-slate-600 hover:bg-slate-200 rounded-lg transition-colors"
              >취소</button>
              <button
                type="button"
                data-action="save-motto"
                class="px-4 py-2 text-sm font-medium text-white bg-teal-600 hover:bg-teal-700 rounded-lg flex items-center gap-1.5 transition-colors shadow-sm"
              >저장</button>
            </div>
          </div>
        `;
        const textarea = document.getElementById('motto-textarea');
        if (textarea) {
          textarea.focus();
          textarea.setSelectionRange(textarea.value.length, textarea.value.length);
        }
        return;
      }

      const lines = motto ? motto.split('\n') : [];
      const mottoHtml = motto
        ? `<span class="font-bold text-base block mb-1 text-slate-800">${escapeHtml(lines[0])}</span>` +
          (lines.length > 1
            ? `<span class="block text-slate-600 text-sm">${escapeHtml(lines.slice(1).join('\n'))}</span>`
            : '')
        : `<span class="text-slate-400 italic text-sm">연필 버튼을 눌러 올해의 푯대 말씀이나 다짐을 입력해주세요.</span>`;

      container.innerHTML = `
        <div class="w-full bg-white p-4 rounded-2xl shadow-sm border border-slate-200/70 group relative">
          <div class="text-xs text-teal-600 font-bold mb-2 flex items-center gap-1.5">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
              <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
            </svg>
            올해의 푯대 말씀 (다짐)
          </div>
          <div class="whitespace-pre-wrap leading-relaxed pr-9 min-h-[2.5rem]">${mottoHtml}</div>
          <button
            type="button"
            data-action="edit-motto"
            class="absolute top-3.5 right-3.5 p-2 text-slate-400 hover:text-teal-600 hover:bg-teal-50 rounded-lg transition-colors"
            title="수정하기"
            aria-label="푯대 말씀 수정"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
            </svg>
          </button>
        </div>
      `;
    };

    const renderSectionCard = ({ sectionType, key, section, showNumber, isRole }) => {
      const isEditingThisTitle =
        state.editingTitle &&
        state.editingTitle.sectionType === sectionType &&
        state.editingTitle.key === key;

      const isAddingHere =
        state.addingSection &&
        state.addingSection.sectionType === sectionType &&
        state.addingSection.key === key;

      const titleBlock = isEditingThisTitle
        ? `
          <div class="flex gap-2 items-center mb-3">
            <input
              type="text"
              id="title-edit-input"
              data-enter-action="save-title"
              data-section-type="${sectionType}"
              data-key="${key}"
              value="${escapeHtml(section.title)}"
              class="flex-1 px-2.5 py-1.5 text-sm border border-teal-400 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
            />
            <button
              type="button"
              data-action="save-title"
              data-section-type="${sectionType}"
              data-key="${key}"
              class="p-2 text-teal-600 hover:bg-teal-50 rounded-lg"
              aria-label="제목 저장"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </button>
            <button
              type="button"
              data-action="cancel-title"
              class="p-2 text-slate-400 hover:bg-slate-100 rounded-lg"
              aria-label="취소"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18" /><path d="m6 6 12 12" />
              </svg>
            </button>
          </div>
        `
        : isRole
          ? `
            <div class="bg-teal-50 inline-flex items-center gap-1.5 px-3 py-1 rounded-full mb-2">
              <h3 class="font-semibold text-teal-700 text-sm">${escapeHtml(section.title)}</h3>
              <button
                type="button"
                data-action="edit-title"
                data-section-type="${sectionType}"
                data-key="${key}"
                class="p-1 text-teal-500/70 hover:text-teal-700 rounded transition-colors"
                title="제목 수정"
                aria-label="제목 수정"
              >
                <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
                </svg>
              </button>
            </div>
          `
          : `
            <div class="flex items-center gap-2 mb-2">
              <h3 class="font-bold text-slate-800 text-base">${escapeHtml(section.title)}</h3>
              <button
                type="button"
                data-action="edit-title"
                data-section-type="${sectionType}"
                data-key="${key}"
                class="p-1.5 text-slate-400 hover:text-teal-600 rounded-lg transition-colors"
                title="제목 수정"
                aria-label="제목 수정"
              >
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
                </svg>
              </button>
            </div>
          `;

      const items = section.items || [];
      const itemsHtml = items
        .map((item, idx) => {
          const isEditingThisItem =
            state.editingItem &&
            state.editingItem.sectionType === sectionType &&
            state.editingItem.key === key &&
            state.editingItem.id === item.id;

          if (isEditingThisItem) {
            return `
              <div class="flex items-center gap-2 bg-teal-50/40 p-2.5 rounded-xl border border-teal-200">
                <input
                  type="text"
                  id="item-edit-input"
                  data-enter-action="save-item"
                  data-section-type="${sectionType}"
                  data-key="${key}"
                  data-id="${item.id}"
                  value="${escapeHtml(item.text)}"
                  class="flex-1 px-2.5 py-1.5 text-sm bg-white border border-teal-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
                />
                <button
                  type="button"
                  data-action="save-item"
                  data-section-type="${sectionType}"
                  data-key="${key}"
                  data-id="${item.id}"
                  class="p-2 text-teal-600 hover:bg-teal-100 rounded-lg"
                  aria-label="항목 저장"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12" />
                  </svg>
                </button>
                <button
                  type="button"
                  data-action="cancel-item"
                  class="p-2 text-slate-400 hover:bg-slate-200 rounded-lg"
                  aria-label="취소"
                >
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M18 6 6 18" /><path d="m6 6 12 12" />
                  </svg>
                </button>
              </div>
            `;
          }

          const checkboxIcon = item.checked
            ? `<svg class="text-teal-600" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                 <rect width="18" height="18" x="3" y="3" rx="3" fill="#0d9488" stroke="#0d9488"/>
                 <path d="m9 12 2 2 4-4" stroke="#ffffff" stroke-width="2.2"/>
               </svg>`
            : `<svg class="text-slate-300 hover:text-teal-500 transition-colors" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                 <rect width="18" height="18" x="3" y="3" rx="3" />
               </svg>`;

          return `
            <div class="flex items-center justify-between gap-2 bg-slate-50/90 p-2.5 rounded-xl border border-slate-100 group">
              <div class="flex-1 flex items-start gap-2.5 min-w-0 text-sm text-slate-700 leading-relaxed">
                <button
                  type="button"
                  data-action="toggle-item"
                  data-section-type="${sectionType}"
                  data-key="${key}"
                  data-id="${item.id}"
                  class="mt-0.5 shrink-0 focus:outline-none"
                  aria-label="완료 체크"
                >
                  ${checkboxIcon}
                </button>
                ${
                  showNumber
                    ? `<span class="text-teal-600 font-semibold mt-0.5 shrink-0 min-w-[16px]">${idx + 1}.</span>`
                    : ''
                }
                <span class="break-words mt-0.5 ${item.checked ? 'line-through text-slate-400' : ''}">
                  ${escapeHtml(item.text)}
                </span>
              </div>
              <div class="flex items-center gap-0.5 shrink-0">
                <button
                  type="button"
                  data-action="edit-item"
                  data-section-type="${sectionType}"
                  data-key="${key}"
                  data-id="${item.id}"
                  class="p-2 text-slate-400 hover:text-teal-600 hover:bg-teal-50 rounded-lg transition-colors"
                  aria-label="항목 수정"
                >
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
                  </svg>
                </button>
                <button
                  type="button"
                  data-action="delete-item"
                  data-section-type="${sectionType}"
                  data-key="${key}"
                  data-id="${item.id}"
                  class="p-2 text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-lg transition-colors"
                  aria-label="항목 삭제"
                >
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 6h18" />
                    <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                    <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                  </svg>
                </button>
              </div>
            </div>
          `;
        })
        .join('');

      const placeholder = isRole ? '역할에 맞는 실천사항을 입력하세요' : '새로운 계획을 입력하세요';
      const addFormHtml = isAddingHere
        ? `
          <div class="flex gap-2 items-center bg-teal-50/60 p-2.5 rounded-xl border border-teal-200 mt-2">
            <input
              type="text"
              id="item-add-input"
              data-enter-action="add-item"
              data-section-type="${sectionType}"
              data-key="${key}"
              placeholder="${placeholder}"
              class="flex-1 px-2.5 py-2 text-sm bg-white border border-teal-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-teal-500"
            />
            <button
              type="button"
              data-action="add-item"
              data-section-type="${sectionType}"
              data-key="${key}"
              class="p-2 text-white bg-teal-600 hover:bg-teal-700 rounded-lg transition-colors"
              aria-label="추가 저장"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="20 6 9 17 4 12" />
              </svg>
            </button>
            <button
              type="button"
              data-action="cancel-add"
              class="p-2 text-slate-400 hover:bg-slate-200 rounded-lg transition-colors"
              aria-label="추가 취소"
            >
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 6 6 18" /><path d="m6 6 12 12" />
              </svg>
            </button>
          </div>
        `
        : `
          <button
            type="button"
            data-action="start-add"
            data-section-type="${sectionType}"
            data-key="${key}"
            class="w-full mt-2 py-2.5 flex items-center justify-center gap-1.5 text-sm text-teal-700 font-medium bg-teal-50/70 hover:bg-teal-100/80 rounded-xl transition-colors border border-dashed border-teal-200"
          >
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M5 12h14" /><path d="M12 5v14" />
            </svg>
            항목 추가
          </button>
        `;

      return `
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200/70 p-4">
          ${titleBlock}
          <div class="space-y-2 mt-2">
            ${itemsHtml}
            ${addFormHtml}
          </div>
        </div>
      `;
    };

    const renderCategories = () => {
      const container = document.getElementById('categories-section');
      const ordered = getOrderedEntries(state.planData?.categories, CATEGORY_ORDER);
      container.innerHTML = ordered
        .map(([key, cat]) =>
          renderSectionCard({
            sectionType: 'categories',
            key,
            section: cat,
            showNumber: true,
            isRole: false
          })
        )
        .join('');
    };

    const renderRoles = () => {
      const container = document.getElementById('roles-section');
      const ordered = getOrderedEntries(state.planData?.roles, ROLE_ORDER);
      container.innerHTML = ordered
        .map(([key, role]) =>
          renderSectionCard({
            sectionType: 'roles',
            key,
            section: role,
            showNumber: false,
            isRole: true
          })
        )
        .join('');
    };

    const renderPreviewDocument = () => {
      const container = document.getElementById('preview-content');
      if (!state.planData) return;

      const motto = state.planData.motto || '';
      const mottoLines = motto ? motto.split('\n') : [];
      const mottoBlock = motto
        ? `
          <div class="mb-7 text-slate-700 whitespace-pre-wrap leading-relaxed">
            <p class="font-bold text-base mb-1 text-black">${escapeHtml(mottoLines[0])}</p>
            ${
              mottoLines.length > 1
                ? `<p class="text-sm">${escapeHtml(mottoLines.slice(1).join('\n'))}</p>`
                : ''
            }
          </div>
        `
        : '';

      const orderedCategories = getOrderedEntries(state.planData.categories, CATEGORY_ORDER);
      const categoriesHtml = orderedCategories
        .map(([, cat]) => {
          const listHtml =
            cat.items && cat.items.length > 0
              ? `<ul class="space-y-1.5">
                  ${cat.items
                    .map(
                      (item, idx) => `
                        <li class="text-sm flex gap-2 items-start">
                          <span class="mt-0.5 text-slate-600 shrink-0">${item.checked ? '☑' : '☐'}</span>
                          <span class="text-slate-600 font-bold min-w-[16px]">${idx + 1}.</span>
                          <span class="${item.checked ? 'line-through text-slate-400' : ''}">${escapeHtml(item.text)}</span>
                        </li>
                      `
                    )
                    .join('')}
                </ul>`
              : `<p class="text-sm text-slate-400 italic">내용이 없습니다.</p>`;

          return `
            <div class="break-inside-avoid">
              <h3 class="font-bold text-base sm:text-lg mb-2 text-black">${escapeHtml(cat.title)}</h3>
              ${listHtml}
            </div>
          `;
        })
        .join('');

      const orderedRoles = getOrderedEntries(state.planData.roles, ROLE_ORDER);
      const rolesHtml = orderedRoles
        .map(([, role]) => {
          const itemsHtml =
            role.items && role.items.length > 0
              ? `<ul class="space-y-1">
                  ${role.items
                    .map(
                      (item) => `
                        <li class="text-xs flex gap-1 items-start leading-snug">
                          <span class="shrink-0 text-slate-600">${item.checked ? '☑' : '•'}</span>
                          <span class="${item.checked ? 'line-through text-slate-400' : ''}">${escapeHtml(item.text)}</span>
                        </li>
                      `
                    )
                    .join('')}
                </ul>`
              : `<p class="text-xs text-center text-slate-300 mt-4">비어있음</p>`;

          return `
            <div class="border-b-2 border-r-2 border-black p-2.5 bg-white min-h-[110px]">
              <h4 class="font-bold text-center border-b border-dashed border-slate-400 pb-1.5 mb-2 bg-slate-50">
                ${escapeHtml(role.title)}
              </h4>
              ${itemsHtml}
            </div>
          `;
        })
        .join('');

      container.innerHTML = `
        <h1 class="text-2xl sm:text-3xl font-bold border-b-2 border-black pb-2 mb-4">
          ${state.year} PLAN (전체)
        </h1>
        ${mottoBlock}
        <div class="space-y-5 mb-8">
          ${categoriesHtml}
        </div>
        <div class="break-inside-avoid">
          <h3 class="font-bold text-sm sm:text-base mb-2 text-black">
            나의 역할 (체크 리스트) --- 순종(듣는데서) - 어떤 상황이 벌어진다 하더라도 ...(어려움)
          </h3>
          <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 border-t-2 border-l-2 border-black text-sm">
            ${rolesHtml}
          </div>
        </div>
      `;
    };

    const focusActiveInput = () => {
      const target =
        document.getElementById('title-edit-input') ||
        document.getElementById('item-edit-input') ||
        document.getElementById('item-add-input');
      if (target) {
        target.focus();
        target.setSelectionRange(target.value.length, target.value.length);
      }
    };

    const renderAll = () => {
      if (!state.planData) return;
      renderMotto();
      renderCategories();
      renderRoles();
      focusActiveInput();
    };

    // =========================================================================
    // 이벤트 위임 및 핸들러 연결
    // =========================================================================
    const handleAction = async (el) => {
      const action = el.dataset.action;
      const sectionType = el.dataset.sectionType;
      const key = el.dataset.key;
      const id = el.dataset.id;

      if (!action) return;

      // 푯대 말씀 편집
      if (action === 'edit-motto') {
        state.editingMotto = true;
        renderMotto();
        return;
      }
      if (action === 'cancel-motto') {
        state.editingMotto = false;
        renderMotto();
        return;
      }
      if (action === 'save-motto') {
        const val = document.getElementById('motto-textarea')?.value.trim() || '';
        state.editingMotto = false;
        const updated = { ...deepClone(state.planData), motto: val };
        await savePlanData(updated);
        return;
      }

      // 주제(제목) 편집
      if (action === 'edit-title') {
        state.editingTitle = { sectionType, key };
        state.editingItem = null;
        state.addingSection = null;
        renderAll();
        return;
      }
      if (action === 'cancel-title') {
        state.editingTitle = null;
        renderAll();
        return;
      }
      if (action === 'save-title') {
        const newTitle = document.getElementById('title-edit-input')?.value.trim();
        state.editingTitle = null;
        if (newTitle && newTitle !== state.planData[sectionType][key].title) {
          const updated = deepClone(state.planData);
          updated[sectionType][key].title = newTitle;
          await savePlanData(updated);
        } else {
          renderAll();
        }
        return;
      }

      // 항목 추가
      if (action === 'start-add') {
        state.addingSection = { sectionType, key };
        state.editingTitle = null;
        state.editingItem = null;
        renderAll();
        return;
      }
      if (action === 'cancel-add') {
        state.addingSection = null;
        renderAll();
        return;
      }
      if (action === 'add-item') {
        const text = document.getElementById('item-add-input')?.value.trim();
        state.addingSection = null;
        if (!text) {
          renderAll();
          return;
        }
        const updated = deepClone(state.planData);
        const list = updated[sectionType][key].items || [];
        list.push({ id: generateId(), text, checked: false });
        updated[sectionType][key].items = list;
        await savePlanData(updated);
        return;
      }

      // 항목 수정
      if (action === 'edit-item') {
        state.editingItem = { sectionType, key, id };
        state.editingTitle = null;
        state.addingSection = null;
        renderAll();
        return;
      }
      if (action === 'cancel-item') {
        state.editingItem = null;
        renderAll();
        return;
      }
      if (action === 'save-item') {
        const text = document.getElementById('item-edit-input')?.value.trim();
        state.editingItem = null;
        if (!text) {
          renderAll();
          return;
        }
        const updated = deepClone(state.planData);
        updated[sectionType][key].items = (updated[sectionType][key].items || []).map((item) =>
          item.id === id ? { ...item, text } : item
        );
        await savePlanData(updated);
        return;
      }

      // 항목 체크 토글
      if (action === 'toggle-item') {
        const updated = deepClone(state.planData);
        updated[sectionType][key].items = (updated[sectionType][key].items || []).map((item) =>
          item.id === id ? { ...item, checked: !item.checked } : item
        );
        await savePlanData(updated);
        return;
      }

      // 항목 삭제 (커스텀 모달 확인)
      if (action === 'delete-item') {
        openConfirmModal({
          title: '항목 삭제',
          message: '이 항목을 정말 삭제하시겠습니까?',
          confirmText: '삭제',
          isDanger: true,
          onConfirm: async () => {
            closeConfirmModal();
            const updated = deepClone(state.planData);
            updated[sectionType][key].items = (updated[sectionType][key].items || []).filter(
              (item) => item.id !== id
            );
            await savePlanData(updated);
          }
        });
      }
    };

    // =========================================================================
    // 앱 초기화 (DOM 로드 후 실행)
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      // 연도 이동 버튼
      document.getElementById('btn-prev-year').addEventListener('click', () => {
        state.year -= 1;
        loadYearPlan();
      });
      document.getElementById('btn-next-year').addEventListener('click', () => {
        state.year += 1;
        loadYearPlan();
      });

      // 미리보기 모달 열기 / 닫기 / 인쇄
      const previewModal = document.getElementById('preview-modal');
      document.getElementById('btn-open-preview').addEventListener('click', () => {
        renderPreviewDocument();
        previewModal.classList.remove('hidden');
        previewModal.classList.add('flex');
      });
      document.getElementById('btn-close-preview').addEventListener('click', () => {
        previewModal.classList.add('hidden');
        previewModal.classList.remove('flex');
      });
      previewModal.addEventListener('click', (e) => {
        if (e.target === previewModal) {
          previewModal.classList.add('hidden');
          previewModal.classList.remove('flex');
        }
      });
      document.getElementById('btn-print').addEventListener('click', () => {
        window.print();
      });

      // 확인 모달 버튼
      document.getElementById('confirm-cancel-btn').addEventListener('click', closeConfirmModal);
      document.getElementById('confirm-ok-btn').addEventListener('click', () => {
        if (typeof state.confirmCallback === 'function') {
          state.confirmCallback();
        } else {
          closeConfirmModal();
        }
      });

      // 작년 계획 불러오기
      document.getElementById('btn-copy-prev-year').addEventListener('click', handleCopyPreviousYear);

      // JSON 파일 백업 & 불러오기
      document.getElementById('btn-export-json').addEventListener('click', handleExportJson);
      const importInput = document.getElementById('input-import-file');
      document.getElementById('btn-import-json').addEventListener('click', () => {
        importInput.value = '';
        importInput.click();
      });
      importInput.addEventListener('change', (e) => {
        handleImportJson(e.target.files[0]);
      });

      // 본문 클릭 이벤트 위임
      document.getElementById('plan-content').addEventListener('click', (e) => {
        const btn = e.target.closest('[data-action]');
        if (btn) handleAction(btn);
      });

      // 입력창 Enter 키 저장 (한글 조합 중 중복 입력 방지)
      document.getElementById('plan-content').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.isComposing && e.target.dataset.enterAction) {
          e.preventDefault();
          const fakeTarget = {
            dataset: {
              action: e.target.dataset.enterAction,
              sectionType: e.target.dataset.sectionType,
              key: e.target.dataset.key,
              id: e.target.dataset.id
            }
          };
          handleAction(fakeTarget);
        }
      });

      // 인증 및 데이터 로드 시작
      if (auth && db) {
        const initAuth = async () => {
          try {
            if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
              await signInWithCustomToken(auth, __initial_auth_token);
            } else {
              await signInAnonymously(auth);
            }
          } catch (err) {
            console.error('인증 오류:', err);
          }
        };
        initAuth();

        onAuthStateChanged(auth, (currentUser) => {
          state.user = currentUser;
          if (currentUser) {
            loadYearPlan();
          } else {
            loadYearPlan();
          }
        });
      } else {
        loadYearPlan();
      }
    });
  </script>
</body>
</html>
